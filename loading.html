<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      background: #fafafa;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    main {
      max-width: 36em;
      padding: 2em;
    }

    h3 {
      margin-bottom: 0.8em;
      font-weight: 600;
    }

    pre {
      margin-bottom: 1em;
      font: inherit;
      white-space: pre-wrap;
    }

    button {
      display: inline-block;
      margin-top: .4em;
      padding: .5em 1.2em;
      border: 1px solid #d0d0d4;
      border-radius: 8px;
      background: #ffffff;
      color: #333338;
      font: inherit;
      font-size: .95em;
      cursor: pointer;
    }

    button:hover {
      background: #f4f4f5;
    }

    button:active {
      background: #eaeaec;
    }

    code {
      display: block;
      margin-bottom: 1em;
      padding: .4em .7em;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      background: #f0f0f0;
      color: #555;
      font-family: Consolas, 'Cascadia Mono', monospace;
      font-size: .85em;
      word-break: break-all;
      user-select: all;
      line-height: 1.9;
    }

    /* 常态不可见：只有带输出框的那几页才显示。 */
    #log-panel {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(760px, calc(100vw - 32px));
      height: 30vh;
      min-height: 120px;
      max-height: 72vh;
      flex-direction: column;
      overflow: hidden;
      resize: vertical;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      background: #ffffff;
      /* 阴影比深色底时轻：浅色版式本来就不靠它压住背景，太重会像一块浮起来的纸板 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, .10);
      color: #3a3a3a;
      text-align: left;
    }

    #log-panel[log] {
      display: flex !important;
    }

    #log-head {
      display: flex;
      align-items: center;
      gap: .6em;
      flex: none;
      padding: .4em .6em;
      background: #f4f4f5;
      border-bottom: 1px solid #e6e6e8;
      font-size: .8em;
      color: #6b6b73;
      cursor: default;
      user-select: none;
    }

    #log-head .log-title {
      font-weight: 600;
      color: #333338;
    }

    #log-count {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      color: #8a8a92;
    }

    #log-box {
      flex: 1 1 auto;
      /* 这一条是必需的：flex 项默认不肯缩到内容以下，少了它滚动条就出不来 */
      min-height: 0;
      overflow: auto;
      padding: .5em .8em;
      font-family: Consolas, 'Cascadia Mono', 'Courier New', monospace;
      font-size: .78em;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-row {
      color: #3f3f45;
    }

    /* 每一行的等级前缀。等级跟着数据来（entry.Level），画笔取一个类名——颜色是 CSS 的事，
       文字里写不出颜色，这也是那段文本能一直用 createTextNode 放进去的原因。 */
    .log-level {
      margin-right: .5em;
      font-weight: 600;
    }

    /* 每行左边一条同色的竖线，这样往上翻的时候不必一行行读前缀也知道哪几行是坏消息。 */
    .log-info {
      border-left: 2px solid #4c9a5e;
      padding-left: .5em;
    }

    .log-warn {
      border-left: 2px solid #c8892a;
      padding-left: .5em;
    }

    .log-error {
      border-left: 2px solid #c0392b;
      padding-left: .5em;
      background: #fdf1f0;
    }

    .log-debug {
      border-left: 2px solid #b9b9c0;
      padding-left: .5em;
      color: #85858d;
    }

    .log-info > .log-level {
      color: #2f7a45;
    }

    .log-warn > .log-level {
      color: #a86c17;
    }

    .log-error > .log-level {
      color: #b03426;
    }

    .log-debug > .log-level {
      color: #9a9aa2;
    }

    #pick-client {
      margin-bottom: 1em;
    }
  </style>
</head>

<body>
  <main>
    <h3>{{ .Title }}</h3>
    <pre>{{ .Body }}</pre>
    {{ range .Path }}<code>{{ . }}</code>{{ end }}
    <!-- 只有本地素材那一页有这个按钮。disabled 是它的原生属性：提取一旦开始就按不动——
         那时候再按只会排进第二次提取，而人多半只是以为没反应。 -->
    {{ if (eq .Name "local") }}<button type="button" id="pick-client" {{ if .Disabled }}disabled{{ end }}>点击选择游戏客户端素材目录</button>{{ end }}
  </main>

  <section id="log-panel" {{ if .Log }}log{{ end }}>
    <div id="log-head">
      <span class="log-title">实时输出</span>
      <span id="log-count">0 行</span>
    </div>
    <div id="log-box"></div>
  </section>

  <!-- 输出框的画笔。
       这段脚本是静态写在页面里的，不经过任何模板值——所以它里面可以放心用引号、&& 和注释：
       模板只认那对包起来的动作，别处的正文它一个字节都不碰。

       反过来说，这段注释和这段脚本里都**不能**写出那对括号的样子：模板是在解析整个文件时找
       动作的，写在注释里它也照认，于是会当场报 "missing value for command"。这条弯路刚走过：
       第一版这段注释就是这么失败的。

       它只管画：Go 推来的是一个数组，每项 { l: 等级, t: 正文 }。等级画成着色的方括号前缀，
       正文跟在后面——两段都用 createTextNode 放进去，从不碰 innerHTML：日志里什么都会出现
       （素材的文件名、服务的报错、别人写的字符串），拼 HTML 就是把它们当标记解释。

       它不看上面那个 log 属性（显示是 CSS 的事），也不回话。 -->
  <script>
    (function () {
      var box = document.getElementById('log-box');
      var count = document.getElementById('log-count');
      if (!box || !count) return;

      // 页面里封顶 200 行，与 Go 那边一次推的上限一致：再多也没有人会往上翻着看。
      var MAX_ROWS = 200;

      // 选择客户端目录：把"用户点了一下"这件事交给 Go，框由它去弹。
      //
      // 浏览器不给页面自己弹文件框的权利（要用户激活才行），而就算弹出来了，<input webkitdirectory>
      // 交回来的也只有相对路径——绝对路径是它故意不给的，而提取要的正是绝对路径。所以这里只负责
      // 把这一下点击传出去，框与路径都归 Go 那一侧。
      var pick = document.getElementById('pick-client');
      if (pick) {
        pick.addEventListener('click', function () {
          if (window._pickFolder) window._pickFolder();
        });
      }

      // 等级 → 类名。认不出来的一律按 info：那是绝大多数行，也是无害的那一类。
      //
      // 大小写在这里归一下，因为两边各自变过：Go 那边用 slog 自己的写法（这里是'INFO'那一类），
      // 而类名是小写的。
      function levelClass(level) {
        var name = String(level || '').toLowerCase();
        if (name === 'error') return 'log-error';
        if (name === 'warn' || name === 'warning') return 'log-warn';
        if (name === 'debug') return 'log-debug';
        return 'log-info';
      }

      // 画一行：先放一个着色的等级前缀，再放正文。
      //
      // 两段都是用 createTextNode 放进去的，从不碰 innerHTML——日志里什么都会出现（素材的文件名、
      // 服务的报错、别人写的字符串），拼 HTML 就是把它们当标记解释。前缀里的方括号也只是文字。
      function addRow(fragment, level, text) {
        var row = document.createElement('div');
        row.className = 'log-row ' + levelClass(level);

        var tag = document.createElement('span');
        tag.className = 'log-level';
        tag.appendChild(document.createTextNode('[' + (level || 'INFO') + ']'));
        row.appendChild(tag);

        row.appendChild(document.createTextNode(text));
        fragment.appendChild(row);
      }

      window.__spLog = function (lines) {
        // 用户停在底部时跟随，往上翻着看时不抢滚动条。
        var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 32;

        var fragment = document.createDocumentFragment();
        lines.forEach(function (line) {
          // 一行一条：Go 推来的是记录，而记录可能带换行（子进程的输出就是按块读的）。
          // 拆开画，每一行都有自己的前缀与颜色，左边那条竖线才不会断。
          String(line.t).split('\n').forEach(function (text) {
            addRow(fragment, line.l, text);
          });
        });
        box.appendChild(fragment);

        while (box.childNodes.length > MAX_ROWS) box.removeChild(box.firstChild);
        count.textContent = box.childNodes.length + ' 行';
        if (atBottom) box.scrollTop = box.scrollHeight;
      };
    })();
  </script>
</body>

</html>
