<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      background: #fafafa;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }

    main {
      max-width: 36em;
      padding: 2em;
      line-height: 1.9;
    }

    h3 {
      margin: 0 0 .8em;
      font-weight: 600;
    }

    pre {
      margin: 0;
      font: inherit;
      white-space: pre-wrap;
    }

    code {
      display: inline-block;
      margin-top: 1.4em;
      padding: .4em .7em;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      background: #f0f0f0;
      color: #555;
      font-family: Consolas, 'Cascadia Mono', monospace;
      font-size: .85em;
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>

<body>
  <main>
    <h3>{{ .Title }}</h3>
    <pre>{{ .Body }}</pre>
    {{ if .Path }}<code>{{ .Path }}</code>{{ end }}
  </main>
</body>

</html>
